# Netlify — le site Next.js vit dans web/. Netlify détecte Next.js et installe
# automatiquement son adaptateur (OpenNext) : pages, routes API, Server
# Actions et ISR tournent dans des fonctions Node.js. Les variables
# d'environnement (DATABASE_URL, SUMUP_*, SMTP_*, …) se règlent dans
# l'interface Netlify, jamais dans ce fichier.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Adaptateur Next.js de Netlify (OpenNext). Déclaré explicitement : sans lui,
# Netlify ne publie que les fichiers statiques de .next, sans la fonction
# serveur, et toutes les pages répondent « Page not found ». Sa version est
# fixée dans web/package.json (devDependencies).
[[plugins]]
  package = "@netlify/plugin-nextjs"
