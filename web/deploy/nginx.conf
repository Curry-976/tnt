# /etc/nginx/sites-available/torrow-web — reverse proxy to the Next.js
# standalone server (see DEPLOY.md). Replace the domain, then:
#   ln -s /etc/nginx/sites-available/torrow-web /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Run certbot afterwards to add the HTTPS server block automatically:
#   certbot --nginx -d torrownamtorrow.com -d www.torrownamtorrow.com

server {
    listen 80;
    listen [::]:80;
    server_name torrownamtorrow.com www.torrownamtorrow.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
